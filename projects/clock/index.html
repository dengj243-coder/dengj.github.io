
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocean Clock</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="ocean">

    <svg class="wave wave1" viewBox="0 0 360 100" preserveAspectRatio="none">
      <path d="M0 30 C30 0 60 0 90 30 S150 60 180 30 S240 0 270 30 S330 60 360 30 V100 H0 Z"/>
    </svg>

    <svg class="wave wave2" viewBox="0 0 360 100" preserveAspectRatio="none">
      <path d="M0 30 C30 0 60 0 90 30 S150 60 180 30 S240 0 270 30 S330 60 360 30 V100 H0 Z"/>
    </svg>

    <svg class="wave wave3" viewBox="0 0 360 100" preserveAspectRatio="none">
      <path d="M0 30 C30 0 60 0 90 30 S150 60 180 30 S240 0 270 30 S330 60 360 30 V100 H0 Z"/>
    </svg>

  </div>

  <script src="script.js"></script>

</body>
</html>
